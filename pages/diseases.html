    <link rel="stylesheet" href="../style.css">
    <style>
        .page-content {
            max-width: 1000px;
            margin: 40px auto;
            padding: 30px;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .page-content h1 {
            color: #007aff;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            border-bottom: 3px solid #007aff;
            padding-bottom: 15px;
        }
        .disease-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
        }
        .disease-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: all 0.3s;
            cursor: pointer;
            text-align: center;
        }
        .disease-card:hover {
            transform: translateY(-5px);
            background: #f0f7ff;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        .disease-card img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            margin-bottom: 15px;
        }
        .disease-card span {
            font-size: 16px;
            color: #333;
            font-weight: bold;
        }
        .back-btn {
            display: inline-block;
            background: #007aff;
            color: #fff;
            padding: 12px 25px;
            border-radius: 25px;
            margin: 20px;
            transition: all 0.3s;
            font-size: 15px;
        }
        .back-btn:hover {
            background: #0056b3;
        }
    </style>
</head>
