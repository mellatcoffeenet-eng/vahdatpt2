<!DOCTYPE html>
<html lang="fa-ir" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گالری - فیزیوتراپی وحدت</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .page-content {
            max-width: 1000px;
            margin: 40px auto;
            padding: 30px;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .page-content h1 {
            color: #007aff;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            border-bottom: 3px solid #007aff;
            padding-bottom: 15px;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .gallery-item {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: all 0.3s;
            cursor: pointer;
        }
        .gallery-item:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }
        .back-btn {
            display: inline-block;
            background: #007aff;
            color: #fff;
            padding: 12px 25px;
            border-radius: 25px;
            margin: 20px;
            transition: all 0.3s;
            font-size: 15px;
        }
        .back-btn:hover {
            background: #0056b3;
        }
    </style>
</head>
<body style="background: #d5a6bd;">
    <div class="main-container">
        <header class="header">
            <a href="../index.html" class="logo">
                <img src="http://vahdatpt.ir/uploadfile/file_portal/site_4395_web/file_portal_end/Seting/Faveicon/لوگو-وحدت(2).png" alt="لوگو" class="logo-img">
            </a>
        </header>
        
        <a href="../index.html" class="back-btn">← بازگشت به صفحه اصلی</a>
        
        <div class="page-content">
            <h1>گالری تصاویر</h1>
            
            <div class="gallery-grid">
                <div class="gallery-item">
                    <img src="http://vahdatpt.ir/uploadfile/file_portal/site_4395_web/file_portal_end/پیوند-های-سایت/اسلایدر/45566.jpg" alt="مرکز">
                </div>
                <div class="gallery-item">
                    <img src="http://vahdatpt.ir/uploadfile/file_portal/site_4395_web/file_portal_end/پیوند-های-سایت/اسلایدر/5.jpg" alt="اتاق تمرین">
                </div>
                <div class="gallery-item">
                    <img src="http://vahdatpt.ir/uploadfile/file_portal/site_4395_web/file_portal_end/پیوند-های-سایت/اسلایدر/6.jpg" alt="لیزر">
                </div>
                <div class="gallery-item">
                    <img src="http://vahdatpt.ir/uploadfile/file_portal/site_4395_web/file_portal_end/پیوند-های-سایت/اسلایدر/بالابر.jpg" alt="بالابر">
                </div>
                <div class="gallery-item">
                    <img src="http://vahdatpt.ir/uploadfile/file_portal/site_4395_web/file_portal_end/پیوند-های-سایت/اسلایدر/تکار.jpg" alt="تکار">
                </div>
                <div class="gallery-item">
                    <img src="http://vahdatpt.ir/uploadfile/file_portal/site_4395_web/file_portal_end/پیوند-های-سایت/اسلایدر/لیزر-پرتوان.jpg" alt="لیزر پرتوان">
                </div>
            </div>
        </div>
        
        <footer class="footer">
            <div class="footer-copyright">
                تمامی حقوق برای فیزیوتراپی وحدت محفوظ است.
            </div>
        </footer>
    </div>
</body>
</html>
